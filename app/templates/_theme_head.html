<script>
(function () {
  var KEY = "teslaslip-ui";
  var LEGACY = "teslaslip-theme";

  var HEIGHTS = {compact: 1, standard: 1, tall: 1};
  var RANGES = {rated: 1, ideal: 1, both: 1};
  var SECTIONS = ["driving", "range", "odometer", "environment", "vehicle", "segments", "destination"];

  function defaults() {
    return {
      theme: "system",
      accent: "blue",
      text: "standard",
      map: true,
      mapHeight: "standard",
      sections: {
        driving: true,
        range: true,
        odometer: true,
        environment: true,
        vehicle: true,
        segments: true,
        destination: true

      rangeMode: "both",
      chargeSamples: true

  function normalize(raw) {
    var base = defaults();
    if (!raw || typeof raw !== "object") return base;
    if (raw.theme === "light" || raw.theme === "dark" || raw.theme === "system") base.theme = raw.theme;
    if (ACCENTS[raw.accent]) base.accent = raw.accent;
    if (raw.text === "large" || raw.text === "standard") base.text = raw.text;
    if (typeof raw.map === "boolean") base.map = raw.map;
    if (HEIGHTS[raw.mapHeight]) base.mapHeight = raw.mapHeight;
    if (RANGES[raw.rangeMode]) base.rangeMode = raw.rangeMode;
    if (typeof raw.chargeSamples === "boolean") base.chargeSamples = raw.chargeSamples;
    if (raw.sections && typeof raw.sections === "object") {
      for (var i = 0; i < SECTIONS.length; i++) {
        var name = SECTIONS[i];
        if (typeof raw.sections[name] === "boolean") base.sections[name] = raw.sections[name];
      }
    }
    return base;
  }

  function read() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return normalize(JSON.parse(raw));
      var prefs = defaults();
      var legacy = localStorage.getItem(LEGACY);
      if (legacy === "light" || legacy === "dark") prefs.theme = legacy;
      return prefs;
    } catch (e) {
      return defaults();
    }
  }

  function systemDark() {
    try {
      return window.matchMedia("(prefers-color-scheme: dark)").matches;
    } catch (e) {
      return false;
    }
  }

  function resolvedDark(prefs) {
    if (prefs.theme === "dark") return true;
    if (prefs.theme === "light") return false;
    return systemDark();
  }

  function apply(prefs) {
    var root = document.documentElement;
    if (resolvedDark(prefs)) root.setAttribute("data-theme", "dark");
    else root.removeAttribute("data-theme");
    if (prefs.accent === "blue") root.removeAttribute("data-accent");
    else root.setAttribute("data-accent", prefs.accent);
    if (prefs.text === "large") root.setAttribute("data-text", "large");
    else root.removeAttribute("data-text");
    if (prefs.map) root.removeAttribute("data-map");
    else root.setAttribute("data-map", "off");
    if (prefs.mapHeight === "standard") root.removeAttribute("data-map-height");
    else root.setAttribute("data-map-height", prefs.mapHeight);
    if (prefs.rangeMode === "both") root.removeAttribute("data-range");
    else root.setAttribute("data-range", prefs.rangeMode);
    var hidden = [];
    for (var i = 0; i < SECTIONS.length; i++) {
      if (!prefs.sections[SECTIONS[i]]) hidden.push(SECTIONS[i]);
    }
    if (!prefs.chargeSamples) hidden.push("samples");
    if (hidden.length) root.setAttribute("data-hide", hidden.join(" "));
    else root.removeAttribute("data-hide");
    document.dispatchEvent(new Event("teslaslip-theme"));
  }

  function save(prefs) {
    var next = normalize(prefs);
    try {
      localStorage.setItem(KEY, JSON.stringify(next));
    } catch (e) {}
    apply(next);
    return next;
  }

  apply(read());
  window.addEventListener("pageshow", function () {
    apply(read());
  });
  try {
    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var onScheme = function () {
      var prefs = read();
      if (prefs.theme === "system") apply(prefs);
    };
    if (media.addEventListener) media.addEventListener("change", onScheme);
    else if (media.addListener) media.addListener(onScheme);
  } catch (e) {}

  window.teslaslipUI = {defaults: defaults, read: read, save: save};
})();
