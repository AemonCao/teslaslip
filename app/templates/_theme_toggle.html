<button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">深色</button>
<script>
(function () {
  var btn = document.getElementById("theme-toggle");
  function dark() {
    return document.documentElement.getAttribute("data-theme") === "dark";
  }
  function sync() {
    var on = dark();
    btn.textContent = on ? "浅色" : "深色";
    btn.setAttribute("aria-pressed", on ? "true" : "false");
  }
  btn.addEventListener("click", function () {
    if (dark()) document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", "dark");
    try {
      localStorage.setItem("teslaslip-theme", dark() ? "dark" : "light");
    } catch (e) {}
    sync();
    document.dispatchEvent(new Event("teslaslip-theme"));
  });
  sync();
})();
</script>
